name: attested-release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tests/test_deployment.py
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: attested-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: >-
          python -m unittest
          tests.test_deployment.DeploymentArtifactTests.test_release_workflow_is_upstream_tag_only_and_attested

  distributions:
    if: github.event_name == 'push' && github.repository == 'GuanZhengPM/TurnAlign'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a version-matched tag reachable from main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"release tag must exactly match project version: {expected}")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install pinned release tooling
        run: >-
          python -m pip install --upgrade pip==26.0.1 build==1.4.4 twine==6.2.0
          cyclonedx-bom==7.3.1 ruff==0.16.5 bandit==1.8.6 mypy==1.18.2
      - name: Run static release checks
        run: |
          ruff check src tests hatch_build.py
          bandit -q -r src hatch_build.py -ll
          mypy --no-error-summary
      - name: Bind deterministic build inputs
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "TURNALIGN_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build reproducible distributions
        run: |
          python -m build --outdir dist-a
          python -m build --outdir dist-b
          cmp dist-a/*.whl dist-b/*.whl
          cmp dist-a/*.tar.gz dist-b/*.tar.gz
          python -m twine check dist-a/*
      - name: Generate reproducible server SBOM
        run: |
          python -m venv sbom-env
          sbom-env/bin/python -m pip install --upgrade \
            pip==26.0.1 setuptools==80.9.0
          sbom-env/bin/python -m pip install dist-a/*.whl "websockets==17.1"
          sbom-env/bin/python -m pip uninstall --yes pip setuptools
          cyclonedx-py environment sbom-env/bin/python \
            --pyproject pyproject.toml --mc-type application --sv 1.6 \
            --output-reproducible --of JSON -o dist-a/sbom.cdx.json
          cyclonedx-py environment sbom-env/bin/python \
            --pyproject pyproject.toml --mc-type application --sv 1.6 \
            --output-reproducible --of JSON -o /tmp/turnalign-release-sbom.cdx.json
          cmp dist-a/sbom.cdx.json /tmp/turnalign-release-sbom.cdx.json
      - name: Test the installed Wheel
        run: |
          python -m pip install --force-reinstall dist-a/*.whl "websockets==17.1"
          python -m unittest discover -s tests
          python -O -m unittest discover -s tests
          python - <<'PY'
          import importlib.resources
          import os

          value = importlib.resources.files("turnalign").joinpath(
              "_source_commit.txt"
          ).read_text()
          if value != os.environ["TURNALIGN_SOURCE_COMMIT"] + "\n":
              raise SystemExit("installed Wheel source identity does not match")
          PY
      - name: Create checksums
        run: |
          cd dist-a
          sha256sum -- ./*.whl ./*.tar.gz ./sbom.cdx.json > SHA256SUMS
      - name: Attest distribution provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist-a/*.whl
            dist-a/*.tar.gz
            dist-a/sbom.cdx.json
            dist-a/SHA256SUMS
      - name: Attest the Wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-a/*.whl
          sbom-path: dist-a/sbom.cdx.json
      - name: Verify published provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in ./dist-a/*.whl ./dist-a/*.tar.gz ./dist-a/sbom.cdx.json ./dist-a/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turnalign-${{ github.ref_name }}-attested-distributions
          path: dist-a/
          if-no-files-found: error
          retention-days: 90
